services:
  - type: web
    name: lung-cancer-backend
    env: docker
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    plan: free
    region: ohio

    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"

  - type: web
    name: lung-cancer-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist

    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: lung-cancer-backend
          property: host
