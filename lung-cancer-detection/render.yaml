services:
  - type: web
    name: lung-cancer-backend
    env: docker
    dockerContext: lung-cancer-detection
    dockerfilePath: lung-cancer-detection/backend/Dockerfile
    plan: free
    region: ohio

    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"

  - type: web
    name: lung-cancer-frontend
    runtime: static
    buildCommand: cd lung-cancer-detection/frontend && npm install && npm run build
    staticPublishPath: lung-cancer-detection/frontend/dist

    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: lung-cancer-backend
          property: host
